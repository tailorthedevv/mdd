<!DOCTYPE html>

  <title>MURDER DRONES // PILOT — OUTPOST 03</title>
  <link rel="icon" href="data:," />
  <style>

  </style>
</head>
<body>
<canvas id="displayCanvas"></canvas>
<script>
  window.__loadErrors = [];
  window.__halted = false;
  (function sizeEarly() {
    const c = document.getElementById('displayCanvas');
    const vw = window.innerWidth || 960, vh = window.innerHeight || 540;
    let cw = vw, ch = Math.floor(vw / (16 / 9));
    if (ch > vh) { ch = vh; cw = Math.floor(vh * (16 / 9)); }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.style.width = `${cw}px`; c.style.height = `${ch}px`;
    c.width = Math.max(480, Math.round(cw * dpr));
    c.height = Math.max(270, Math.round(ch * dpr));
  })();
  function showCanvasError(msg) {
    window.__halted = true;
    const c = document.getElementById('displayCanvas');
    const ctx = c && c.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#070b14'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#ff2e4c'; ctx.font = 'bold 20px monospace';
    ctx.fillText('BOOT ERROR: ' + msg, 32, 60);
  }
  window.addEventListener('error', (e) => {

    showCanvasError(`${e.message} @ ${f}:${e.lineno || 0}`);
  });
</script>
<script src="core.js" onerror="window.__loadErrors.push('core.js')"></script>
<script src="assets.js" onerror="window.__loadErrors.push('assets.js')"></script>
<script src="story.js" onerror="window.__loadErrors.push('story.js')"></script>
<script src="world.js" onerror="window.__loadErrors.push('world.js')"></script>
<script src="combat.js" onerror="window.__loadErrors.push('combat.js')"></script>
<script>
(() => {
  'use strict';
  if (window.__loadErrors.length > 0) { showCanvasError('Missing: ' + window.__loadErrors.join(', ')); return; }

  const MD = window.MD;
  const {
    PW, PH, TS, DT, clamp, lerp, noise1D, offscreen, measureText, drawText, wrapText, drawSolverSymbol,
    AudioEngine, AssetFactory, StoryDirector, VerletSystem, ParticleSystem, LevelManager, CombatSystem
  } = MD;

  // =========================================================================
  // 1. HD LIGHTING & ATMOSPHERIC POST-PROCESSING ENGINE
  // =========================================================================
  class LightingEngine {
    constructor() {
      const lb = offscreen(640, 360, true);
      this.lightCanvas = lb.c;
      this.lctx = lb.ctx;
    }

    render(dctx, dw, dh, cx, cy, time, level, player, prx, pry, story, combat) {
      const sx = dw / PW, sy = dh / PH;
      const lx = 640 / PW, ly = 360 / PH;
      const pal = level.pal;
      const lctx = this.lctx;

      lctx.clearRect(0, 0, 640, 360);
      lctx.globalCompositeOperation = 'source-over';
      lctx.fillStyle = pal.shadow;
      lctx.fillRect(0, 0, 640, 360);
      lctx.globalCompositeOperation = 'destination-out';

      const carve = (wx, wy, rad, str = 0.96) => {
        const x = (wx - cx) * lx, y = (wy - cy) * ly, r = rad * lx;
        if (x + r < 0 || x - r > 640 || y + r < 0 || y - r > 360) return;
        const g = lctx.createRadialGradient(x, y, r * 0.05, x, y, r);
        g.addColorStop(0, `rgba(0,0,0,${str})`);
        g.addColorStop(0.55, `rgba(0,0,0,${str * 0.5})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        lctx.fillStyle = g;
        lctx.beginPath(); lctx.arc(x, y, r, 0, Math.PI * 2); lctx.fill();
      };

      carve(prx + 6, pry + 9, 96);
      level.lamps.forEach(lp => carve(lp.x + 9, lp.y + 14, 118));
      level.signs.forEach(sg => carve(sg.x + 50, sg.y + 18, 128));
      level.canisters.forEach(cn => carve(cn.x + 7, cn.y + 10, 64));
      level.terminals.forEach(tm => carve(tm.x + 9, tm.y + 10, 56));
      level.cells.forEach(cl => { if (!cl.got) carve(cl.x + 5, cl.y + 6, 44); });
      level.pickups.forEach(pk => { if (!pk.got) carve(pk.x + 6, pk.y + 6, 62); });
      if (combat.boss && !combat.boss.dead) carve(combat.boss.x, combat.boss.y - 16, 115);
      for (const s of combat.playerShots) carve(s.x, s.y, 44);
      for (const s of combat.enemyShots) carve(s.x, s.y, 38);
      for (const bm of combat.beams) carve(prx + bm.dir * 160, pry + 9, 210);

      lctx.globalCompositeOperation = 'source-over';
      dctx.save();
      dctx.imageSmoothingEnabled = true;
      dctx.drawImage(this.lightCanvas, 0, 0, dw, dh);

      // Additive Volumetric Cones, Siren Pulses & Blooms
      dctx.globalCompositeOperation = 'lighter';
      const bloom = (wx, wy, rad, col) => {
        const x = (wx - cx) * sx, y = (wy - cy) * sy, r = rad * sx;
        if (x + r < 0 || x - r > dw || y + r < 0 || y - r > dh) return;
        const g = dctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        dctx.fillStyle = g;
        dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
      };

      // Lamps + Volumetric Downward Cones + Emergency Red Klaxon Pulse
      const sirenPulse = (level.act >= 3) ? (0.55 + 0.45 * Math.sin(time * 5.2)) : 1.0;
      level.lamps.forEach(lp => {
        const flk = noise1D(time * 8, lp.x) > 0.12 ? 1.0 : 0.45;
        const bx = lp.x + 9 + Math.sin(lp.ang) * 20, by = lp.y + 13;
        const isRed = lp.red;
        const mod = (isRed ? sirenPulse : 1.0) * flk;
        bloom(bx, by, 72 * mod, isRed ? `rgba(255, 46, 76, ${0.32 * mod})` : `rgba(255, 185, 65, ${0.26 * mod})`);

        const kx = (bx - cx) * sx, ky = (by - cy) * sy;
        const ch = 88 * sy, cw = 48 * sx, sh = Math.sin(lp.ang) * 26 * sx;
        const cg = dctx.createLinearGradient(kx, ky, kx + sh, ky + ch);
        cg.addColorStop(0, isRed ? `rgba(255, 46, 76, ${0.20 * mod})` : `rgba(255, 195, 80, ${0.15 * mod})`);
        cg.addColorStop(1, 'rgba(0,0,0,0)');
        dctx.fillStyle = cg;
        dctx.beginPath();
        dctx.moveTo(kx - 4 * sx, ky); dctx.lineTo(kx + 4 * sx, ky);
        dctx.lineTo(kx + cw + sh, ky + ch); dctx.lineTo(kx - cw + sh, ky + ch);
        dctx.closePath(); dctx.fill();
      });

      // Nanite Acid Pools & Canisters Upward Glow
      level.canisters.forEach(cn => bloom(cn.x + 7, cn.y + 10, 44, 'rgba(255, 225, 53, 0.24)'));
      level.puddles.forEach(pd => {
        if (pd.acid) {
          for (let hx = pd.x + 24; hx < pd.x + pd.w; hx += 48) {
            bloom(hx, pd.y, 58, 'rgba(255, 225, 53, 0.25)');
          }
        }
      });

      // Uzi Subtle Purple Solver Rim Glow + Railgun Charge Aura
      const uziCol = story.state.solverFlash > 0 || story.state.solverEnding > 0
        ? 'rgba(255, 225, 53, 0.34)'
        : (player.railCharge >= 1 && player.hasCore ? 'rgba(56, 255, 140, 0.24)' : 'rgba(194, 77, 255, 0.18)');
      bloom(prx + 6, pry + 9, 44, uziCol);

      // Shots & Cutscene Railgun Beam Bloom
      for (const s of combat.playerShots) bloom(s.x, s.y, 28, 'rgba(56, 255, 140, 0.30)');
      for (const s of combat.enemyShots) bloom(s.x, s.y, 24, 'rgba(255, 70, 80, 0.28)');
      if (story.state.beamActive > 0) {
        const tx = story.state.nX > 0 ? story.state.nX : story.state.jX;
        const x0 = (prx + 12 - cx) * sx, y0 = (pry + 8 - cy) * sy;
        const x1 = (tx + 90 - cx) * sx;
        dctx.fillStyle = `rgba(56, 255, 140, ${story.state.beamActive * 0.65})`;
        dctx.fillRect(Math.min(x0, x1), y0 - 18 * sy, Math.abs(x1 - x0), 36 * sy);
        dctx.fillStyle = `rgba(255, 255, 255, ${story.state.beamActive})`;
        dctx.fillRect(Math.min(x0, x1), y0 - 5 * sy, Math.abs(x1 - x0), 10 * sy);
      }

      // Holographic Canonical Absolute Solver Symbol (during Glitch / Parry / Ending!)
      if (story.state.solverFlash > 0 || story.state.solverEnding > 0) {
        const sMode = story.state.solverEnding > 0 ? (Math.sin(time * 8) > 0 ? 'scale' : 'translate') : 'rotate';
        const sxPos = (prx + 6 - cx) * sx, syPos = (pry - 14 - cy) * sy;
        drawSolverSymbol(dctx, sxPos, syPos, 17 * sx, '#ffe135', sMode, Math.sin(time * 12) * 0.15, 2.2 * sx, true);
      }

      // Screen Flash & Vignette
      dctx.globalCompositeOperation = 'source-over';
      if (story.state.screenFlash) {
        dctx.fillStyle = story.state.screenFlash;
        dctx.globalAlpha = 0.42; dctx.fillRect(0, 0, dw, dh); dctx.globalAlpha = 1;
      }
      dctx.fillStyle = pal.fog; dctx.fillRect(0, 0, dw, dh);
      const vig = dctx.createRadialGradient(dw * 0.5, dh * 0.5, dh * 0.34, dw * 0.5, dh * 0.5, dw * 0.68);
      vig.addColorStop(0, 'rgba(2,3,8,0)'); vig.addColorStop(1, 'rgba(2,3,8,0.52)');
      dctx.fillStyle = vig; dctx.fillRect(0, 0, dw, dh);

      dctx.restore();
    }
  }

  // =========================================================================
  // 2. CAMERA & PLAYER
  // =========================================================================
  class Camera {
    constructor() { this.x = 0; this.y = 0; this.px = 0; this.py = 0; this.shakeMag = 0; this.sx = 0; this.sy = 0; }
    snapTo(wx, wy, ww, wh) {
      this.x = clamp(wx - PW * 0.5, 0, ww - PW);
      this.y = clamp(wy - PH * 0.56, 0, wh - PH);
      this.px = this.x; this.py = this.y;
    }
    shake(a) { this.shakeMag = Math.max(this.shakeMag, a); }
    update(dt, player, ww, wh, story) {
      this.px = this.x; this.py = this.y;
      let tx, ty;
      if (story.active && story.queue[story.idx]?.cam) {
        tx = clamp(story.queue[story.idx].cam[0], 0, ww - PW);
        ty = clamp(story.queue[story.idx].cam[1], 0, wh - PH);
      } else if (story.state.camPanX !== null) {
        tx = clamp(story.state.camPanX, 0, ww - PW);
        ty = clamp(player.y - PH * 0.56, 0, wh - PH);
      } else {
        tx = clamp(player.x + 6 + player.face * 36 + player.vx * 0.14 - PW * 0.5, 0, ww - PW);
        ty = clamp(player.y + 9 - PH * 0.58, 0, wh - PH);
      }
      const sm = 1 - Math.exp(-6.5 * dt);
      this.x = lerp(this.x, tx, sm); this.y = lerp(this.y, ty, sm);
      if (this.shakeMag > 0.05) {
        this.sx = (Math.random() * 2 - 1) * this.shakeMag;
        this.sy = (Math.random() * 2 - 1) * this.shakeMag;
        this.shakeMag *= Math.exp(-12 * dt);
      } else { this.shakeMag = 0; this.sx = 0; this.sy = 0; }
    }
  }

  // =========================================================================
  // 3. MASTER GAME ENGINE
  // =========================================================================
  class Game {
    constructor() {
      this.disp = document.getElementById('displayCanvas');
      this.dctx = this.disp.getContext('2d');
      const pb = offscreen(PW + 2, PH + 2);
      this.pixCanvas = pb.c; this.pctx = pb.ctx;

      this.assets = new AssetFactory();
      this.assets.bakeAll();

      this.audio = new AudioEngine();
      this.verlet = new VerletSystem();
      this.particles = new ParticleSystem(118 * TS, 26 * TS, MD.BIOME_PALETTES.bunker);
      this.level = new LevelManager(this.assets, this.verlet, this.particles, this.audio);
      this.combat = new CombatSystem(this.audio, this.particles);
      this.story = new StoryDirector();
      this.lighting = new LightingEngine();
      this.camera = new Camera();

      this.player = {
        x: 8 * TS, y: 22 * TS, px: 8 * TS, py: 22 * TS, w: 12, h: 18,
        vx: 0, vy: 0, face: 1, ground: false, onTruss: false, rideId: null,
        coyote: 0, jBuf: 0, dropT: 0, anim: 0, stepT: 0, blink: 2.5, sqX: 1, sqY: 1,
        hp: 5, maxHp: 5, invuln: 0,
        hasRailgun: false, hasWrench: false, hasPen: false, hasCore: false,
        railCharge: 1, gunCd: 0, wrenchCd: 0, penCd: 0,
        cpX: 8 * TS, cpY: 22 * TS
      };

      this.state = {
        time: 0, runTime: 0, cells: 0, logs: new Set(),
        activeTerm: null, finaleDone: false, hintAlpha: 1,
        transState: 'none', transAlpha: 0, pendingAct: null, bannerText: '', bannerTimer: 0
      };

      this.keys = { L: false, R: false, D: false, JHeld: false, JPress: false };
      this.acc = 0; this.last = performance.now();

      this.bindInput();
      this.resize();
      window.addEventListener('resize', () => this.resize());

      this.loadAct(0, true);
      requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
      const vw = window.innerWidth, vh = window.innerHeight;
      let cw = vw, ch = Math.floor(vw / (16 / 9));
      if (ch > vh) { ch = vh; cw = Math.floor(vh * (16 / 9)); }
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.disp.style.width = `${cw}px`; this.disp.style.height = `${ch}px`;
      this.disp.width = Math.max(PW, Math.round(cw * dpr));
      this.disp.height = Math.max(PH, Math.round(ch * dpr));
    }

    loadAct(actIdx, isBoot = false) {
      this.combat.reset();
      this.story.resetState();
      this.level.loadAct(actIdx);

      const p = this.player;
      p.x = this.level.spawn.x; p.y = this.level.spawn.y;
      p.px = p.x; p.py = p.y; p.vx = 0; p.vy = 0;
      p.cpX = p.x; p.cpY = p.y; p.hp = p.maxHp; p.invuln = 0; p.rideId = null;

      if (actIdx >= 1) { p.hasRailgun = true; p.hasWrench = true; p.hasPen = true; }
      if (actIdx >= 2) { p.hasCore = true; p.railCharge = 1; }

      this.camera.snapTo(p.x, p.y, this.level.ww, this.level.wh);
      this.state.activeTerm = null;
      this.showBanner(this.level.pal.name);

      if (isBoot) {
        this.story.play('act1_intro', this);
      }
    }

    nextAct() {
      if (this.state.transState !== 'none') return;
      this.state.pendingAct = Math.min(4, this.level.act + 1);
      this.state.transState = 'out';
      this.state.transAlpha = 0;
    }

    respawnPlayer() {
      const p = this.player;
      p.x = p.cpX; p.y = p.cpY; p.px = p.cpX; p.py = p.cpY;
      p.vx = 0; p.vy = 0; p.hp = p.maxHp; p.invuln = 1.5; p.rideId = null;
      this.camera.snapTo(p.x, p.y, this.level.ww, this.level.wh);
      this.particles.burst(p.x + 6, p.y + 9, '#c24dff', 18, 75);
    }

    showBanner(txt) {
      this.state.bannerText = txt;
      this.state.bannerTimer = 3.2;
    }

    bindInput() {
      window.addEventListener('keydown', (e) => {
        this.audio.unlock();
        const c = e.code;
        if (this.story.active) {
          if (c === 'Space' || c === 'Enter') { this.story.advance(this); e.preventDefault(); }
          if (c === 'Escape') { this.story.skip(this); }
          return;
        }
        if (c === 'KeyA' || c === 'ArrowLeft') this.keys.L = true;
        if (c === 'KeyD' || c === 'ArrowRight') this.keys.R = true;
        if (c === 'KeyS' || c === 'ArrowDown') this.keys.D = true;
        if (c === 'Space' || c === 'KeyW' || c === 'ArrowUp') {
          if (!this.keys.JHeld) this.keys.JPress = true;
          this.keys.JHeld = true; e.preventDefault();
        }
        if (c === 'KeyF' || c === 'KeyE') this.combat.fireWeapon('railgun', this.player, this.level, this.camera);
        if (c === 'KeyJ' || c === 'KeyX') this.combat.fireWeapon('wrench', this.player, this.level, this.camera);
        if (c === 'KeyQ') this.combat.fireWeapon('pen', this.player, this.level, this.camera);
        if (c === 'KeyM') this.audio.toggleMute();
        if (c === 'KeyR') {
          if (this.state.finaleDone) {
            this.story.reset(); this.state.finaleDone = false; this.state.cells = 0; this.state.logs.clear(); this.state.runTime = 0;
            this.player.hasRailgun = false; this.player.hasWrench = false; this.player.hasPen = false; this.player.hasCore = false;
            this.loadAct(0, true);
          } else {
            this.respawnPlayer();
          }
        }
        if (c.startsWith('Digit') || c.startsWith('Numpad')) {
          const n = parseInt(c.slice(-1), 10);
          if (n >= 1 && n <= 5 && this.state.transState === 'none') {
            this.state.finaleDone = false;
            this.state.pendingAct = n - 1;
            this.state.transState = 'out';
            this.state.transAlpha = 0;
          }
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.keys.L = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') this.keys.R = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') this.keys.D = false;
        if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') this.keys.JHeld = false;
      });
      window.addEventListener('pointerdown', () => {
        this.audio.unlock();
        if (this.story.active) this.story.advance(this);
      });
    }

    step(dt) {
      this.state.time += dt;
      if (!this.story.active && !this.state.finaleDone) this.state.runTime += dt;
      if (this.state.bannerTimer > 0) this.state.bannerTimer -= dt;

      // Act Transition Fade
      if (this.state.transState === 'out') {
        this.state.transAlpha = Math.min(1, this.state.transAlpha + dt * 2.5);
        if (this.state.transAlpha >= 1) {
          this.loadAct(this.state.pendingAct, false);
          this.state.transState = 'in';
        }
      } else if (this.state.transState === 'in') {
        this.state.transAlpha = Math.max(0, this.state.transAlpha - dt * 2.5);
        if (this.state.transAlpha <= 0) this.state.transState = 'none';
      }

      this.story.update(dt, this);
      this.level.updateMachinery(dt, this.state.time, this.player);

      // Sync Boss coordinates into StoryDirector puppets for smooth climax scenes
      if (this.combat.boss) {
        if (this.combat.boss.kind === 'N') {
          this.story.state.nX = this.combat.boss.x; this.story.state.nY = this.combat.boss.y;
        } else {
          this.story.state.jX = this.combat.boss.x; this.story.state.jY = this.combat.boss.y;
        }
      }

      const p = this.player;
      p.px = p.x; p.py = p.y;

      if (!this.story.active && this.state.transState !== 'out' && !this.state.finaleDone) {
        // Carry on moving gondola / lift
        if (p.ground && p.rideId) {
          const pl = this.level.getPlatforms().find(x => x.id === p.rideId);
          if (pl) { p.x += pl.dx; p.y += pl.dy; }
        }

        const dir = (this.keys.R ? 1 : 0) - (this.keys.L ? 1 : 0);
        if (dir !== 0) { p.face = dir; this.state.hintAlpha = Math.max(0, this.state.hintAlpha - dt * 0.4); }
        if (dir !== 0) p.vx = clamp(p.vx + dir * (p.ground ? 940 : 640) * dt, -122, 122);
        else {
          const f = (p.ground ? 1050 : 280) * dt;
          p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
        }

        if (p.dropT > 0) p.dropT -= dt;
        if (p.ground && p.onTruss && this.keys.D) { p.dropT = 0.22; p.ground = false; p.coyote = 0; p.vy = 32; }
        if (p.ground) p.coyote = 0.11; else if (p.coyote > 0) p.coyote -= dt;
        if (this.keys.JPress) p.jBuf = 0.12; else if (p.jBuf > 0) p.jBuf -= dt;
        this.keys.JPress = false;

        if (p.jBuf > 0 && p.coyote > 0 && !(p.onTruss && this.keys.D)) {
          p.vy = -325; p.ground = false; p.rideId = null; p.coyote = 0; p.jBuf = 0;
          p.sqX = 0.82; p.sqY = 1.22; this.audio.playJump();
          this.particles.burst(p.x + 6, p.y + 18, '#87a6c7', 5, 35);
        }
        if (!this.keys.JHeld && p.vy < -110) p.vy *= Math.pow(0.45, dt * 16);
        p.vy = Math.min(410, p.vy + (p.vy < 0 ? 850 : 940) * dt);

        // X collision
        p.x += p.vx * dt;
        const r0 = Math.floor((p.y + 1) / TS), r1 = Math.floor((p.y + p.h - 1) / TS);
        if (p.vx > 0) {
          const rc = Math.floor((p.x + p.w) / TS);
          for (let r = r0; r <= r1; r++) if (this.level.isSolid(rc, r)) { p.x = rc * TS - p.w; p.vx = 0; break; }
        } else if (p.vx < 0) {
          const lc = Math.floor(p.x / TS);
          for (let r = r0; r <= r1; r++) if (this.level.isSolid(lc, r)) { p.x = (lc + 1) * TS; p.vx = 0; break; }
        }

        // Y collision (Moving platforms take HIGHEST priority!)
        const prevBot = p.y + p.h, prevVy = p.vy, wasG = p.ground, wasRide = p.rideId;
        p.y += p.vy * dt;
        p.ground = false; p.onTruss = false; p.rideId = null;

        if (p.vy >= 0) {
          for (const pl of this.level.getPlatforms()) {
            if (p.x + p.w - 1 > pl.x && p.x + 1 < pl.x + pl.w) {
              const tol = wasRide === pl.id ? 2 : 0.25;
              if (prevBot <= Math.max(pl.py, pl.y) + 6 && p.y + p.h >= pl.y - tol) {
                p.y = pl.y - p.h; p.vy = 0; p.ground = true; p.rideId = pl.id; break;
              }
            }
          }
          if (!p.ground) {
            const br = Math.floor((p.y + p.h) / TS);
            const c0 = Math.floor((p.x + 1) / TS), c1 = Math.floor((p.x + p.w - 1) / TS);
            for (let c = c0; c <= c1; c++) {
              if (this.level.isSolid(c, br)) { p.y = br * TS - p.h; p.vy = 0; p.ground = true; break; }
              if (p.dropT <= 0 && this.level.isTruss(c, br) && prevBot <= br * TS + 3) {
                p.y = br * TS - p.h; p.vy = 0; p.ground = true; p.onTruss = true; break;
              }
            }
          }
        } else {
          const tr = Math.floor(p.y / TS);
          const c0 = Math.floor((p.x + 1) / TS), c1 = Math.floor((p.x + p.w - 1) / TS);
          for (let c = c0; c <= c1; c++) if (this.level.isSolid(c, tr)) { p.y = (tr + 1) * TS; p.vy = 0; break; }
        }

        if (!wasG && p.ground) {
          p.sqX = 1.2; p.sqY = 0.82;
          if (prevVy > 260) this.camera.shake(2);
          this.audio.playLand(prevVy > 260);
          this.particles.burst(p.x + 6, p.y + 18, '#87a6c7', 4, 30);
        }
        if (p.ground && Math.abs(p.vx) > 25) {
          p.stepT -= dt;
          if (p.stepT <= 0) { p.stepT = 0.24; this.audio.playStep(p.onTruss || p.rideId); }
        }

        // Check Hazards, Collectibles, Pickups, Terminals, Story Triggers & Exit Zone
        const pcx = p.x + 6, pcy = p.y + 9;
        for (const hz of this.level.hazards) {
          if (pcx > hz.x && pcx < hz.x + hz.w && p.y + p.h > hz.y + 2) {
            this.combat.hurtPlayer(p, this.camera, this);
            if (p.hp > 0) { p.x = p.cpX; p.y = p.cpY; p.vx = 0; p.vy = 0; }
          }
        }
        for (const cl of this.level.cells) {
          if (!cl.got && Math.hypot(pcx - (cl.x + 5), pcy - (cl.y + 6)) < 16) {
            cl.got = true; this.state.cells++; p.railCharge = Math.min(1, p.railCharge + 0.35);
            this.audio.playPickup(); this.particles.burst(cl.x + 5, cl.y + 6, '#38ff8c', 14);
          }
        }
        for (const pk of this.level.pickups) {
          if (pk.got || Math.hypot(pcx - (pk.x + 6), pcy - (pk.y + 6)) >= 18) continue;
          pk.got = true; this.audio.playPickup();
          if (pk.kind === 'pen') {
            p.hasPen = true; this.showBanner('JCJENSON PEN ACQUIRED! [Q] THROW');
            this.particles.burst(pk.x + 6, pk.y + 6, '#ffe135', 14);
          } else if (pk.kind === 'oil') {
            p.hp = p.maxHp; this.showBanner('WARM OIL RESTORED // HP FULL');
            this.particles.burst(pk.x + 6, pk.y + 6, '#38ff8c', 14);
          } else if (pk.kind === 'core') {
            p.hasCore = true; p.railCharge = 1;
            this.story.play('act2_n_arrive', this, () => this.combat.startBossN(p));
          }
        }

        let nt = null;
        for (const tm of this.level.terminals) {
          if (Math.hypot(pcx - (tm.x + 9), pcy - (tm.y + 11)) < 26) {
            nt = tm;
            if (!tm.read) {
              tm.read = true; this.state.logs.add(tm.title);
              this.audio.playPickup(); p.cpX = tm.x; p.cpY = tm.y - 2;
            }
          }
        }
        this.state.activeTerm = nt;

        for (const tr of this.level.triggers) {
          if (pcx >= tr.x && !this.story.played.has(tr.id)) {
            this.story.play(tr.id, this, () => {
              if (tr.nextAct !== undefined) this.nextAct();
              if (tr.startFinalBoss) this.combat.startBossVJ();
            });
          }
        }

        if (this.level.exitZone && pcx >= this.level.exitZone.x) {
          this.nextAct();
        }
      }

      p.sqX = lerp(p.sqX, 1, 1 - Math.exp(-16 * dt));
      p.sqY = lerp(p.sqY, 1, 1 - Math.exp(-16 * dt));
      p.anim += dt * (Math.abs(p.vx) > 14 ? 10 : 4);
      p.blink -= dt;
      if (p.blink <= -0.11) p.blink = 2 + Math.random() * 2.5;

      this.combat.update(dt, this.state.time, p, this.level, this.camera, this);
      this.verlet.update(dt, this.state.time, p, this.level.biome === 'blizzard' ? -28 : 0);
      this.particles.update(dt, this.state.time, this.level, this.camera.x);
      this.camera.update(dt, p, this.level.ww, this.level.wh, this.story);
    }

    render(alpha) {
      const pctx = this.pctx;
      const cx = clamp(lerp(this.camera.px, this.camera.x, alpha) + this.camera.sx, 0, this.level.ww - PW);
      const cy = clamp(lerp(this.camera.py, this.camera.y, alpha) + this.camera.sy, 0, this.level.wh - PH);
      const ix = Math.floor(cx), iy = Math.floor(cy), fx = cx - ix, fy = cy - iy;
      const t = this.state.time, biome = this.level.biome, bg = this.assets.bg[biome];

      pctx.imageSmoothingEnabled = false;
      pctx.drawImage(bg.sky, 0, 0, PW + 2, PH + 2);

      // Parallax Layers 1-3
      const fx1 = -((Math.floor(cx * 0.15) % 640 + 640) % 640);
      pctx.drawImage(bg.far, fx1, 0); pctx.drawImage(bg.far, fx1 + 640, 0);
      const mx2 = -((Math.floor(cx * 0.35) % 512 + 512) % 512);
      pctx.drawImage(bg.mid, mx2, 0); pctx.drawImage(bg.mid, mx2 + 512, 0);
      if (bg.mid.leds) {
        for (const led of bg.mid.leds) if (Math.sin(t * 4 + led.p) > -0.1) {
          pctx.fillStyle = led.col;
          pctx.fillRect(mx2 + led.x, led.y, 1, 1); pctx.fillRect(mx2 + 512 + led.x, led.y, 1, 1);
        }
      }
      const nx3 = -((Math.floor(cx * 0.65) % 480 + 480) % 480);
      pctx.drawImage(bg.near, nx3, 0); pctx.drawImage(bg.near, nx3 + 480, 0);

      // Landmarks (Corpse Spire, Landing Pod, Card Table, Projector, Nurse Bed)
      for (const lm of this.level.landmarks) {
        const lx = Math.round(lm.x - ix), ly = Math.round(lm.y - iy);
        if (lm.type === 'corpseSpire') pctx.drawImage(this.assets.corpseSpire, lx, ly);
        else if (lm.type === 'landingPod') pctx.drawImage(this.assets.landingPod, lx, ly);
        else if (lm.type === 'cardTable') pctx.drawImage(this.assets.cardTable, lx, ly);
        else if (lm.type === 'projector') pctx.drawImage(this.assets.projector, lx, ly);
        else if (lm.type === 'nurseBed') pctx.drawImage(this.assets.nurseBed, lx, ly);
      }

      // Auto-tiled Terrain & Steel Trusses
      const c0 = Math.max(0, Math.floor(ix / TS) - 1), c1 = Math.min(this.level.cols - 1, Math.ceil((ix + PW + 2) / TS) + 1);
      const r0 = Math.max(0, Math.floor(iy / TS) - 1), r1 = Math.min(this.level.rows - 1, Math.ceil((iy + PH + 2) / TS) + 1);
      const corners = this.assets.corners[biome];
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const cell = this.level.grid[r][c], wx = c * TS - ix, wy = r * TS - iy;
        if (cell === '#') {
          const m = this.level.masks[r][c];
          pctx.drawImage(this.assets.tiles[biome][m][Math.floor(hash2D(c, r, 7) * 4)], wx - 2, wy - 6);
          if ((m & 9) === 9 && this.level.grid[r - 1]?.[c - 1] !== '#') pctx.drawImage(corners.NW, wx, wy);
          if ((m & 3) === 3 && this.level.grid[r - 1]?.[c + 1] !== '#') pctx.drawImage(corners.NE, wx + 12, wy);
        } else if (cell === 'T') {
          pctx.drawImage(this.assets.trusses[biome][c & 3], wx, wy);
        }
      }

      // Props, Terminals, Signs, Doors & Lifts
      this.level.crates.forEach(cr => pctx.drawImage(this.assets.crates[cr.v], Math.round(cr.x - ix), Math.round(cr.y - iy)));
      this.level.canisters.forEach(cn => pctx.drawImage(this.assets.canister, Math.round(cn.x - ix), Math.round(cn.y - iy)));
      this.level.terminals.forEach(tm => {
        const tx = Math.round(tm.x - ix), ty = Math.round(tm.y - iy);
        pctx.drawImage(this.assets.terminal, tx, ty);
        pctx.fillStyle = tm.read ? '#38ff8c' : '#c24dff';
        pctx.fillRect(tx + 4, ty + 4, 8, 1); pctx.fillRect(tx + 4, ty + 6, 6, 1);
      });
      this.level.signs.forEach(sg => {
        const spr = this.assets.signs[sg.spr], sx = Math.round(sg.x - ix), sy = Math.round(sg.y - iy);
        pctx.drawImage(spr, sx, sy);
        pctx.fillStyle = noise1D(t * 14, spr.seed) > 0.2 ? '#ffffff' : spr.glow;
        pctx.fillRect(sx + spr.tube.x, sy + spr.tube.y, spr.tube.w, spr.tube.h);
      });
      this.level.switches.forEach(sw => pctx.drawImage(this.assets.sw[sw.pressed ? 1 : 0], Math.round(sw.x - ix), Math.round(sw.y - iy)));
      this.level.doors.forEach(d => {
        const dx = Math.round(d.x - ix), dy = Math.round(d.y - iy);
        pctx.save(); pctx.beginPath(); pctx.rect(dx, dy, 18, 52); pctx.clip();
        pctx.drawImage(this.assets.doors[d.id] || this.assets.doors['01'], dx, dy - Math.round(d.prog * 46));
        pctx.restore();
      });
      this.level.gondolas.forEach(g => {
        const gx = Math.round(lerp(g.px, g.x, alpha) - ix), gy = Math.round(g.y - iy);
        pctx.fillStyle = '#253347'; pctx.fillRect(Math.round(g.x0 - ix), gy - 22, (g.x1 - g.x0) + 48, 3);
        pctx.fillStyle = '#5c7594'; pctx.fillRect(gx + 23, gy - 20, 2, 22);
        pctx.drawImage(this.assets.lift, gx, gy);
      });
      this.level.lifts.forEach(l => {
        const lx = Math.round(l.x - ix), ly = Math.round(lerp(l.py, l.y, alpha) - iy);
        pctx.fillStyle = '#5c7594'; pctx.fillRect(lx + 23, Math.round(l.topY - 32 - iy), 2, Math.max(0, ly - Math.round(l.topY - 32 - iy)));
        pctx.drawImage(this.assets.lift, lx, ly);
      });
      this.level.lamps.forEach(lp => {
        const lx = Math.round(lp.x - ix + Math.sin(lp.ang) * 20), ly = Math.round(lp.y - iy);
        pctx.fillStyle = '#253347'; pctx.fillRect(Math.round(lp.x - ix) + 8, Math.round(lp.top - iy), 2, Math.max(0, ly - Math.round(lp.top - iy)));
        pctx.drawImage(lp.red ? this.assets.lamps.red : this.assets.lamps.amber, lx, ly);
      });

      // Collectibles & Stabilizer Core
      this.level.cells.forEach(cl => {
        if (!cl.got) pctx.drawImage(this.assets.cellFrames[Math.floor(t * 6 + cl.p) % 4], Math.round(cl.x - ix), Math.round(cl.y + Math.sin(t * 3.5 + cl.p) * 2 - iy));
      });
      this.level.pickups.forEach(pk => {
        if (pk.got) return;
        const px = Math.round(pk.x - ix), py = Math.round(pk.y + Math.sin(t * 3) * 2 - iy);
        if (pk.kind === 'pen') pctx.drawImage(this.assets.pen, px, py);
        else if (pk.kind === 'oil') pctx.drawImage(this.assets.oilCan, px, py);
        else if (pk.kind === 'core') drawSolverSymbol(pctx, px + 6, py + 6, 10, '#c24dff', 'translate', t * 0.7, 1.5);
      });

      // Liquid Water & Nanite Acid Pools
      const p = this.player, prx = lerp(p.px, p.x, alpha), pry = lerp(p.py, p.y, alpha);
      this.level.puddles.forEach(pd => {
        const px = Math.round(pd.x - ix), py = Math.round(pd.y - iy);
        pctx.fillStyle = pd.acid ? 'rgba(180, 140, 10, 0.86)' : 'rgba(12, 42, 74, 0.78)';
        pctx.fillRect(px, py, pd.w, pd.h);
        for (let k = 0; k < pd.w; k += 4) {
          pctx.fillStyle = pd.acid ? (Math.sin(t * 3 + k) > 0 ? '#ffe135' : '#b88a00') : (Math.sin(t * 3 + k) > 0 ? '#87d4ff' : '#265b8c');
          pctx.fillRect(px + k, py, 3, 1);
        }
      });

      // Story Cast NPCs & Cutscene Puppets
      this.renderStoryNPCs(pctx, ix, iy, t);

      // Combat System (Turrets, Bugs, Boss N/V/J, Shots, Beams)
      this.combat.levelEnemiesRef = this.level.enemies;
      this.combat.render(pctx, ix, iy, this.assets, t);

      // Verlet Cables & Uzi Protagonist
      this.verlet.render(pctx, ix, iy);
      this.renderUzi(pctx, ix, iy, prx, pry, t);

      // Particles & Snow
      this.particles.render(pctx, ix, iy, biome === 'blizzard' || biome === 'spire');

      // Composite Pixel Buffer -> HD Display Canvas
      const dw = this.disp.width, dh = this.disp.height, sx = dw / PW, sy = dh / PH;
      this.dctx.clearRect(0, 0, dw, dh);
      this.dctx.imageSmoothingEnabled = false;
      this.dctx.drawImage(this.pixCanvas, -fx * sx, -fy * sy, (PW + 2) * sx, (PH + 2) * sy);

      // Smooth HD Lighting, Cones, Blooms & Solver Hologram
      this.lighting.render(this.dctx, dw, dh, cx, cy, t, this.level, p, prx, pry, this.story, this.combat);

      // Blurred 1.3x Foreground Depth-of-Field Framing
      if (biome !== 'evac') {
        this.dctx.save();
        this.dctx.imageSmoothingEnabled = true;
        const fgX = cx * 1.3, st = -((Math.floor(fgX) % 520 + 520) % 520);
        for (let i = 0, x = st; x < PW + 260; x += 260, i++) {
          this.dctx.drawImage(this.assets.dofBot[i % 2], (x - 14) * sx, (PH - 34 - 14) * sy, this.assets.dofBot[0].width * sx, this.assets.dofBot[0].height * sy);
        }
        this.dctx.restore();
      }

      // HUD, Terminals, Cutscene Box & Finale Summary
      this.renderUI(this.dctx, sx, sy, ix, iy, t);
    }

    renderStoryNPCs(ctx, ix, iy, t) {
      const st = this.story.state;
      // Static Act NPCs
      if (this.level.act === 0) {
        ctx.drawImage(this.assets.npcs.teacher, Math.round(21 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.lizzy, Math.round(35 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.doll, Math.round(37 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.thad, Math.round(45 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.wdf, Math.round(90 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.wdf, Math.round(94 * TS - ix), Math.round(24 * TS - 22 - iy));
        if (!this.story.played.has('act1_khan_door') || this.story.active) {
          ctx.drawImage(this.assets.npcs.khan, Math.round(101 * TS - ix), Math.round(24 * TS - 22 - iy));
        }
      }
      if (this.level.act === 2) {
        ctx.drawImage(this.assets.npcs.wdf, Math.round(108 * TS - ix), Math.round(24 * TS - 22 - iy));
        ctx.drawImage(this.assets.npcs.wdf, Math.round(112 * TS - ix), Math.round(24 * TS - 22 - iy));
      }
      if (this.level.act === 3 && st.khanX > 0 && !st.khanFled) {
        ctx.drawImage(this.assets.npcs.khan, Math.round(st.khanX - ix), Math.round(24 * TS - 22 - iy));
      }
      if (this.level.act === 4) {
        ctx.drawImage(this.assets.npcs.thad, Math.round(18 * TS - ix), Math.round(24 * TS - 22 - iy));
        if (this.state.finaleDone || this.story.id === 'act5_j_defeat_finale') {
          ctx.drawImage(this.assets.npcs.khan, Math.round(48 * TS - ix), Math.round(24 * TS - 22 - iy));
        }
      }

      // Cutscene N & J Puppets
      if (this.story.active && st.nX > 0) {
        const nx = Math.round(st.nX - ix), ny = Math.round(st.nY - iy);
        const spr = st.nPose === 'headless' ? this.assets.nDrone.headless : (st.nPose === 'wings' ? this.assets.nDrone.wings : this.assets.nDrone.idle);
        ctx.drawImage(spr, nx - 16, ny - 30);
        if (st.nPose !== 'headless') {
          ctx.fillStyle = '#ffe135';
          if (st.nVisor === 'X') { ctx.fillRect(nx - 2, ny - 23, 4, 1); ctx.fillRect(nx - 1, ny - 22, 2, 2); }
          else { ctx.fillRect(nx - 3, ny - 22, 2, 2); ctx.fillRect(nx + 1, ny - 22, 2, 2); }
        }
      }
      if (this.story.active && st.jX > 0 && !st.jDead) {
        const jx = Math.round(st.jX - ix), jy = Math.round(st.jY - iy);
        ctx.drawImage(st.jPenned ? this.assets.jDrone.penned : this.assets.jDrone.wings, jx - 16, jy - 30);
        ctx.fillStyle = '#ffe135'; ctx.fillRect(jx - 2, jy - 23, 4, 1); ctx.fillRect(jx - 1, jy - 22, 2, 2);
      }
    }

    renderUzi(ctx, ix, iy, prx, pry, t) {
      const p = this.player, st = this.story.state;
      if (p.invuln > 0 && Math.floor(t * 20) % 2 === 0) return;

      let frames = !p.ground ? (p.vy < 0 ? this.assets.uzi.jump : this.assets.uzi.fall) : (Math.abs(p.vx) > 14 ? this.assets.uzi.run : this.assets.uzi.idle);
      if (this.combat.slashAnim) frames = this.assets.uzi.wrench;
      else if (st.uziPose === 'gun' || (p.hasRailgun && this.combat.beams.length > 0)) frames = this.assets.uzi.gun;
      else if (st.uziHurtHand || st.uziPose === 'hurt') frames = this.assets.uzi.hurt;

      const fr = frames[Math.floor(p.anim) % frames.length];
      ctx.save();
      ctx.translate(Math.round(prx + 6 - ix), Math.round(pry + 18 - iy));
      ctx.scale((this.story.active ? st.uziFacing : p.face) * p.sqX, p.sqY);
      ctx.drawImage(fr, -12, -22);

      const vx = fr.vx - 12, vy = fr.vy - 22, lx = Math.abs(p.vx) > 14 ? 1 : 0;
      const solverGlitch = st.solverEnding > 0 || st.solverFlash > 0;
      ctx.fillStyle = solverGlitch && Math.sin(t * 26) > -0.2 ? '#ffe135' : '#d48cff';
      if (p.blink < 0) { ctx.fillRect(vx + 1 + lx, vy + 2, 2, 1); ctx.fillRect(vx + 4 + lx, vy + 2, 2, 1); }
      else { ctx.fillRect(vx + 1 + lx, vy + 1, 2, 2); ctx.fillRect(vx + 4 + lx, vy + 1, 2, 2); }
      ctx.restore();
    }

    renderUI(dctx, sx, sy, ix, iy, t) {
      dctx.save();
      dctx.imageSmoothingEnabled = false;
      dctx.scale(sx, sy);

      // Top-left Solver Charge Icon, HP/Oil Pips & Act Label
      const p = this.player;
      drawSolverSymbol(dctx, 18, 16, 8, p.railCharge >= 1 && p.hasCore ? '#38ff8c' : '#c24dff', p.hasCore ? 'scale' : 'translate', t * 0.5, 1.2);
      drawText(dctx, `ACT ${this.level.act + 1}/5  •  CELLS:${this.state.cells}`, 32, 8, '#eef4ff');
      // HP Pips
      for (let i = 0; i < p.maxHp; i++) {
        dctx.fillStyle = i < p.hp ? '#c24dff' : '#1b2436';
        dctx.fillRect(32 + i * 7, 17, 5, 4);
      }
      if (p.hasRailgun) {
        dctx.fillStyle = '#182233'; dctx.fillRect(72, 17, 36, 4);
        dctx.fillStyle = p.railCharge >= 1 && p.hasCore ? '#38ff8c' : '#7b94ad';
        dctx.fillRect(72, 17, Math.round(36 * (p.hasCore ? p.railCharge : 0.35)), 4);
      }
      drawText(dctx, `[1-5] ACT  ${this.audio.muted ? 'M:OFF' : 'M:SFX'}`, PW - 84, 8, '#8fa8c7');

      // Boss HP Bar
      if (this.combat.boss && !this.combat.boss.dead) {
        const b = this.combat.boss, bw = 110, bx = Math.round((PW - bw) * 0.5);
        dctx.fillStyle = 'rgba(4, 8, 18, 0.82)'; dctx.fillRect(bx - 4, 5, bw + 8, 14);
        drawText(dctx, b.kind === 'N' ? 'SERIAL DESIGNATION N' : 'SERIAL DESIGNATION J & V', bx + 4, 7, '#ffe135');
        dctx.fillStyle = '#241418'; dctx.fillRect(bx + 4, 14, bw - 8, 3);
        dctx.fillStyle = '#ffe135'; dctx.fillRect(bx + 4, 14, Math.round((bw - 8) * (b.hp / b.maxHp)), 3);
      }

      // Terminal Log Window
      if (this.state.activeTerm && !this.story.active) {
        const tm = this.state.activeTerm, lines = [tm.title, ...tm.lines];
        let mw = 0; lines.forEach(l => mw = Math.max(mw, measureText(l)));
        const bw = mw + 14, bh = lines.length * 8 + 10;
        const tx = clamp(Math.round(tm.x + 9 - ix - bw * 0.5), 6, PW - bw - 6);
        const ty = clamp(Math.round(tm.y - iy - bh - 6), 6, PH - bh - 6);
        dctx.fillStyle = 'rgba(4, 10, 20, 0.92)'; dctx.fillRect(tx, ty, bw, bh);
        dctx.fillStyle = '#c24dff'; dctx.fillRect(tx, ty, bw, 1); dctx.fillRect(tx, ty + bh - 1, bw, 1);
        drawText(dctx, tm.title, tx + 7, ty + 5, '#e699ff');
        tm.lines.forEach((l, i) => drawText(dctx, l, tx + 7, ty + 14 + i * 8, '#dce9fa'));
      }

      // Controls Hint
      if (this.state.hintAlpha > 0.02 && !this.story.active) {
        dctx.globalAlpha = this.state.hintAlpha;
        const h = 'A/D MOVE • SPACE JUMP • F RAILGUN • J WRENCH • Q PEN';
        drawText(dctx, h, Math.round((PW - measureText(h)) * 0.5), PH - 16, '#dce9fa');
        dctx.globalAlpha = 1;
      }

      // Banner
      if (this.state.bannerTimer > 0 && !this.story.active) {
        const bw = measureText(this.state.bannerText) + 14;
        dctx.fillStyle = 'rgba(4, 8, 18, 0.8)'; dctx.fillRect(Math.round((PW - bw) * 0.5), 24, bw, 11);
        drawText(dctx, this.state.bannerText, Math.round((PW - bw) * 0.5) + 7, 27, '#ffe135');
      }

      // Animated Cutscene Letterbox & Dialogue Box
      if (this.story.active) {
        dctx.fillStyle = '#020308';
        dctx.fillRect(0, 0, PW, 24); dctx.fillRect(0, PH - 46, PW, 46);
        const cur = this.story.queue[this.story.idx];
        if (cur) {
          dctx.fillStyle = cur.color; dctx.fillRect(0, PH - 46, PW, 1);
          drawText(dctx, `${cur.who}:`, 14, PH - 39, cur.color);
          const shown = cur.text.slice(0, Math.floor(this.story.charIdx));
          const wrapped = wrapText(shown, PW - 36);
          wrapped.slice(0, 2).forEach((ln, i) => drawText(dctx, ln, 14, PH - 29 + i * 9, '#ffffff'));
          drawText(dctx, 'SPACE >  [ESC] SKIP', PW - 92, PH - 10, '#7b94ad');
        }
      }

      // Pilot Complete Summary Card
      if (this.state.finaleDone && !this.story.active) {
        const cw = 200, ch = 78, bx = Math.round((PW - cw) * 0.5), by = 40;
        const mins = String(Math.floor(this.state.runTime / 60)).padStart(2, '0');
        const secs = String(Math.floor(this.state.runTime % 60)).padStart(2, '0');
        dctx.fillStyle = 'rgba(4, 8, 18, 0.92)'; dctx.fillRect(bx, by, cw, ch);
        dctx.fillStyle = '#ffe135'; dctx.fillRect(bx, by, cw, 1); dctx.fillRect(bx, by + ch - 1, cw, 1);
        drawSolverSymbol(dctx, bx + 22, by + 26, 12, '#ffe135', 'scale', t * 0.8, 1.5);
        drawText(dctx, 'PILOT EPISODE COMPLETE', bx + 42, by + 10, '#ffffff');
        drawText(dctx, 'THINKING ABOUT KILLING ALL HUMANS', bx + 42, by + 20, '#ffe135');
        drawText(dctx, `CELLS: ${this.state.cells}   LOGS: ${this.state.logs.size}/7`, bx + 42, by + 35, '#38ff8c');
        drawText(dctx, `TIME: ${mins}:${secs}`, bx + 42, by + 45, '#cfe8ff');
        drawText(dctx, '[R] REPLAY   [1-5] CHAPTERS', bx + 42, by + 61, '#d48cff');
      }

      if (this.state.transAlpha > 0.01) {
        dctx.fillStyle = `rgba(2, 3, 8, ${this.state.transAlpha})`;
        dctx.fillRect(0, 0, PW, PH);
      }

      dctx.restore();
    }

    loop(now) {
      if (window.__halted) return;
      this.acc += Math.min(0.05, Math.max(0, (now - this.last) / 1000));
      this.last = now;
      while (this.acc >= DT) { this.step(DT); this.acc -= DT; }
      this.render(this.acc / DT);
      requestAnimationFrame((t) => this.loop(t));
    }
  }

  new Game();
})();
</script>
